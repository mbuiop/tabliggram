<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>رادار سیگنال کریپتو</title>
<style>
:root{
  --c1:#249dc5; --c2:#00f8f8; --c3:#0c606d; --c4:#ebeb00;
  --ink:#000; --mut:#000; --bg:#f3fbfd; --card:#fff; --line:#7fc3d3;
  --y:#ebeb00; --yp:#fff7a0; --yd:#c9c900; --red:#ffb4b4; --navh:70px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:inherit;min-width:0}
html{height:100%;background:var(--bg)}
html,body{margin:0;max-width:100%;overflow-x:hidden;touch-action:pan-y;overscroll-behavior-x:none}
body{min-height:100%;color:#000;font:400 14px/1.7 Vazirmatn,Tahoma,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%;background:var(--bg)}
button,input,select,textarea{font:inherit;color:#000}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{width:100%;max-width:980px;margin:0 auto;padding:10px 12px calc(96px + env(safe-area-inset-bottom,0px))}

/* دکمه‌ها: زرد، تخت، بدون هیچ سایه یا درخشش */
.btn{border:2px solid #000;cursor:pointer;color:#000;font-weight:700;padding:7px 16px;border-radius:12px;background:var(--y);box-shadow:none;text-shadow:none;transition:background .1s}
.btn:active{background:var(--yd)}
.btn.xs{padding:3px 10px;font-size:12px;border-radius:10px;border-width:1.5px}
.btn.off{background:var(--yp)}
.btn.on{background:var(--y);border-width:3px}
.btn.rec{border-width:4px}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #000;outline-offset:2px}
button:disabled{opacity:.55}

/* سربرگ */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:6px 0 8px}
.brand{flex:1 1 200px}
.brand h1{margin:0;font-size:20px;font-weight:800}
.brand p{margin:0;font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 12px;border-radius:999px;background:#fff;border:2px solid #000;font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c4);border:1px solid #000}
.chip.ok .dot{background:var(--c2)} .chip.bad .dot{background:var(--red)}
.tickers{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;max-width:100%;touch-action:pan-x pan-y}
.tk{flex:0 0 auto;padding:2px 12px;border-radius:12px;background:#fff;border:2px solid var(--line);font-size:12px;display:flex;gap:8px}
.tk b{font-weight:700}
.tk.up{border-color:var(--c2)} .tk.dn{border-color:var(--c4)}

/* پنل‌ها */
.pane{display:none}
.pane.on{display:block}
.msg{margin:6px 0;padding:9px 14px;border-radius:14px;font-size:13px;display:flex;gap:10px;align-items:flex-start;background:#fff;border:2px solid var(--c4)}
.msg .body{flex:1}
.msg.err{border-color:var(--red)}
.msg.bc{border-color:var(--c1);background:#eafcff}
.msg.bc b{display:block}
.msg .x{background:none;border:0;cursor:pointer;font-size:18px;line-height:1}
.cycle{background:#eafcff;border:2px solid var(--c1);border-radius:18px;padding:10px 14px;margin:6px 0 12px}
.cycle .r{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:13px;font-weight:700}
.meter{height:10px;background:#d7f3f8;border-radius:99px;margin-top:8px;overflow:hidden;border:1px solid var(--c1)}
.meter i{display:block;height:100%;width:0;background:var(--c1);border-radius:99px;transition:width .3s}
.prog{font-size:12px;min-height:16px;margin-top:4px}
.acts{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}

/* کارت‌های دوتایی */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--card);border:2px solid var(--c1);border-radius:18px;padding:8px 9px 10px;position:relative;overflow:hidden;font-size:11.5px;line-height:1.55}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:7px;background:var(--c1)}
.card.S::before{background:var(--c4)}
.card.S{border-color:#bdbd00}
.card.done{opacity:.85}
.card.ph{border-style:dashed;opacity:.7}
.card.stopped{border-color:#000;border-style:dashed}
.chd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:6px}
.dir{padding:0 10px;border-radius:999px;font-weight:800;font-size:12px;background:var(--c1);border:1.5px solid #000}
.card.S .dir{background:var(--c4)}
.q{font-weight:800;font-size:11px;background:var(--c2);border:1.5px solid #000;border-radius:999px;padding:0 8px}
.tm{font-size:10.5px}
.stl{display:flex;justify-content:space-between;font-size:11px;margin-top:2px}
.str{height:8px;border-radius:99px;background:#d7f3f8;border:1px solid var(--c1);overflow:hidden;margin:2px 0 5px}
.str i{display:block;height:100%;background:var(--c1);border-radius:99px}
.crow{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:2px 0;border-bottom:1px dashed var(--line)}
.crow b{font-weight:700;font-size:12px}
.crow.hit b{background:var(--c2);border-radius:6px;padding:0 4px}
.crow.slr b{background:var(--red);border-radius:6px;padding:0 4px}
.crow.sym{border-bottom:0} .crow.sym b{font-size:13px}
.ctags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.ct{font-size:10px;padding:0 7px;border-radius:999px;border:1px solid #000;background:#fff}
.ct.y{background:var(--c4);font-weight:800}
.roe{font-size:10.5px;margin-top:4px}
.why{font-size:10.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cst{margin-top:5px;font-weight:800;font-size:11.5px;padding:1px 8px;border-radius:10px;background:#fff;border:1.5px solid #000;text-align:center}
.cst.win{background:var(--c2)}
.cst.loss{background:var(--red)}
.live{font-size:10.5px;margin-top:3px}
.cbtn{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.cbtn .btn{flex:1 1 auto;padding:2px 6px}
.note{font-size:12px;line-height:1.9;margin:8px 0 0}

/* جعبه‌ها و آمار */
.box{background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-top:12px;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.stat{background:#fff;border:2px solid var(--c1);border-radius:16px;padding:6px 12px}
.stat b{display:block;font-size:19px} .stat span{font-size:11px}
h3.sub{font-size:14px;margin:14px 0 6px} h3.sec{font-size:15px;margin:14px 0 8px}
details.box summary{cursor:pointer;font-weight:800}
table.tb{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
.tb th{font-weight:700;padding:5px 4px;text-align:start;border-bottom:2px solid var(--c1);background:#eafcff}
.tb td{padding:5px 4px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.item{background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-block;font-size:11px;padding:0 9px;border-radius:999px;border:1.5px solid #000;background:#fff;font-weight:700}
.pill.l{background:var(--c1)} .pill.s{background:var(--c4)} .pill.pos{background:var(--c2)} .pill.neg{background:var(--red)}
select,input[type=text],input:not([type]),input[inputmode]{background:#fff;border:2px solid #000;border-radius:10px;padding:4px 10px;font:inherit;color:#000}
input[type=range]{accent-color:#000;width:100%;padding:0}
input[type=checkbox]{accent-color:#000;width:18px;height:18px;vertical-align:middle}
.seg{display:flex;border:2px solid #000;border-radius:12px;overflow:hidden;background:#fff}
.seg button{flex:1;border:0;border-inline-start:2px solid #000;padding:4px 6px;cursor:pointer;font-weight:700;background:var(--yp)}
.seg button:first-child{border-inline-start:0}
.seg button.on{background:var(--y)}
.seg.wrapseg{flex-wrap:wrap}.seg.wrapseg button{flex:1 1 30%}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctl input{width:150px;direction:ltr;text-align:left}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv b{font-weight:700;text-align:end}
.kv b.up{background:var(--c2);border-radius:6px;padding:0 6px} .kv b.dn{background:var(--c4);border-radius:6px;padding:0 6px}

/* چارت تمام‌صفحه */
#tab-chart.on{display:flex;flex-direction:column;position:fixed;left:0;right:0;top:0;bottom:var(--navh);z-index:30;background:var(--bg);padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;gap:6px}
.ctop{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ctop input{width:96px;direction:ltr;text-align:left;padding:2px 8px}
.ctop .seg{flex:1 1 150px}
.chips{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;touch-action:pan-x;padding-bottom:2px}
.chips .btn{flex:0 0 auto}
.chartbox{position:relative;flex:1 1 auto;min-height:140px;background:#fff;border:2px solid #000;border-radius:12px;overflow:hidden;touch-action:none}
.chartbox canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.chinfo{position:absolute;top:6px;left:6px;z-index:2;background:#fff;border:1.5px solid #000;border-radius:8px;padding:0 8px;font-size:12px;max-width:calc(100% - 12px);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;pointer-events:none}
.chmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-weight:700;text-align:center;padding:20px}
.fl{display:none;position:absolute;top:34px;left:6px;z-index:3;gap:6px}
body.imm .fl{display:flex}
body.imm .ctop,body.imm .chips{display:none}
body.imm .nav{display:none}
body.imm{--navh:0px}
.sheet{display:none;flex:0 0 auto;max-height:48%;overflow-y:auto;background:#fff;border:2px solid #000;border-radius:12px;padding:8px 10px}
.sheet.open{display:block}
.sheet .box{margin-top:8px;border-color:#000}
.sheet .seg{margin:8px 0}

/* فیوچرز دمو (شبیه فیوچرز باینس) */
.fhead{background:#fff;border:2px solid #000;border-radius:14px;padding:8px 12px}
.pbig{font-size:26px;font-weight:800;line-height:1.3}
.frm label{display:block;margin-top:8px;font-weight:700;font-size:12px}
.fin{width:100%;direction:ltr;text-align:left;margin-top:2px}
.row2{display:flex;gap:8px;align-items:center}
.row2>*{flex:1}
.row2>.btn{flex:0 0 auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.two .btn{padding:10px 6px;font-size:14px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px;font-size:12px;margin-top:6px}
.g3 span{display:block;font-size:11px}
.g3 b{font-weight:700}
.lvq{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
#modal.on{display:flex}
.mbox label{display:block;margin-top:8px;font-weight:700;font-size:12px}
.mbox{background:#fff;border:3px solid #000;border-radius:16px;padding:14px;max-width:360px;width:100%}

/* نوار پایین */
.nav{position:fixed;inset:auto 0 0 0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));background:#fff;border-top:3px solid #000}
.nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:5px 2px;font-size:11px;line-height:1.35;border-radius:14px;min-height:52px}
.nav button i{font-style:normal;font-size:17px;line-height:1.1}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--y);color:#000;padding:8px 18px;border-radius:14px;font-weight:700;font-size:13px;z-index:90;transition:all .2s;border:2px solid #000;max-width:92vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){.meter i,.btn,#toast{transition:none}}
@media(min-width:700px){.grid2{gap:14px}.card{font-size:12.5px}.crow b{font-size:13px}.stats{grid-template-columns:repeat(4,1fr)}}

/* ===== ظاهر جدید: تخت، بدون سایه، متن مشکی، دکمه‌های زرد ===== */
html{background:linear-gradient(180deg,#e6f7fb 0,#f6fcfd 260px) fixed}
body{background:transparent;letter-spacing:0}
.wrap{padding-top:8px}
.hero{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,var(--c2) 0,#5fe3ee 45%,var(--c1) 100%);border:2px solid #000;border-radius:22px;padding:12px 14px;margin:4px 0 10px}
.logo{flex:0 0 auto;width:46px;height:46px;border-radius:15px;background:var(--y);border:2px solid #000;display:grid;place-items:center}
.hero .brand{flex:1 1 0}
.hero .brand h1{font-size:19px;line-height:1.35}
.hero .brand p{font-size:11.5px;line-height:1.5;opacity:1}
.hero .chip{flex:0 0 auto;background:#fff}
.chip.bad{background:var(--yp)}
.tickers{gap:6px;padding:0 0 10px;scrollbar-width:none}
.tickers::-webkit-scrollbar{display:none}
.tk{align-items:center;padding:3px 12px 3px 10px;border-radius:999px;border:2px solid #000;background:#fff;font-size:12px}
.tk::before{content:"•";font-size:14px;line-height:1}
.tk.up{background:#c9fbfb;border-color:#000}.tk.up::before{content:"▲";font-size:9px}
.tk.dn{background:var(--yp);border-color:#000}.tk.dn::before{content:"▼";font-size:9px}
.tk.old{background:#eef3f5;border-style:dashed}
.cycle{border-radius:20px;background:#fff;border:2px solid #000;padding:12px 14px}
.meter{height:12px;border:2px solid #000;background:#fff;border-radius:99px}
.meter i{background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:0}
.msg{border:2px solid #000;border-radius:16px;background:var(--yp)}
.msg.err{background:#ffe3e3}.msg.bc{background:#d9f7fb}
.card{border:2px solid #000;border-radius:20px;padding:12px 11px 12px;background:#fff}
.card::before{height:10px;background:linear-gradient(90deg,var(--c1),var(--c2))}
.card.S::before{background:linear-gradient(90deg,var(--c4),#fff77a)}
.card.S,.card.L{border-color:#000}
.chd{margin-top:8px}
.dir{border:2px solid #000;padding:1px 12px}
.crow{padding:3px 0;border-bottom:1px solid #d6edf2}
.crow:last-of-type{border-bottom:0}
.str{height:10px;border:2px solid #000;background:#fff}
.str i{background:linear-gradient(90deg,var(--c1),var(--c2))}
.stat{border:2px solid #000;border-radius:18px;background:#fff}
.stat b{font-size:21px}
.box,.item,.fhead,.sheet{border:2px solid #000;border-radius:18px}
.tb th{background:#d9f7fb;border-bottom:2px solid #000}
.tb td{border-bottom:1px solid #cfe6ec}
.btn{border-radius:14px}
.nav{border-top:3px solid #000;border-radius:24px 24px 0 0;background:#fff;gap:6px;padding-top:8px}
.nav button{border-radius:16px;font-weight:800}
.nav button.on{border-width:3px}
.nav button.off{background:var(--yp)}
.chartbox{border-radius:16px}
#toast{border:2px solid #000}
::selection{background:var(--c2);color:#000}
@media(min-width:700px){.hero .brand h1{font-size:22px}.wrap{padding-top:14px}}

/* ===== نسخهٔ ۲: تم تاریک/روشن، گیج، ابزارها، چارت ===== */
:root{--gtrack:#cfe6ec;--surf:#fff}
html[data-theme=dark]{--bg:#0b1115;--card:#131d22;--line:#2c4753;--ink:#e8f1f4;--yp:#cfc95a;--gtrack:#2a3d46;--surf:#131d22;color-scheme:dark}
html[data-theme=dark]{background:linear-gradient(180deg,#0e1a20 0,#0b1115 260px) fixed}
html[data-theme=dark] body{color:var(--ink)}
html[data-theme=dark] .chip,html[data-theme=dark] .tk,html[data-theme=dark] .cycle,html[data-theme=dark] .card,html[data-theme=dark] .box,html[data-theme=dark] .stat,html[data-theme=dark] .item,html[data-theme=dark] .fhead,html[data-theme=dark] .sheet,html[data-theme=dark] .chartbox,html[data-theme=dark] .mbox,html[data-theme=dark] .nav,html[data-theme=dark] .chinfo,html[data-theme=dark] .seg,html[data-theme=dark] .ct,html[data-theme=dark] .cst,html[data-theme=dark] .meter,html[data-theme=dark] .str,html[data-theme=dark] .pill,html[data-theme=dark] .msg,html[data-theme=dark] .tools,html[data-theme=dark] .hm{background:var(--surf);color:var(--ink);border-color:#3d6272}
html[data-theme=dark] select,html[data-theme=dark] input[type=text],html[data-theme=dark] input:not([type]),html[data-theme=dark] input[inputmode]{background:#0f181d;color:var(--ink);border-color:#3d6272}
html[data-theme=dark] .hero{background:linear-gradient(120deg,#0b4a55 0,#0d5e73 55%,#14708a 100%);color:var(--ink);border-color:#3d6272}
html[data-theme=dark] .tk.up{background:#0d3a2c}html[data-theme=dark] .tk.dn{background:#3d1a22}html[data-theme=dark] .tk.old{background:#182329}
html[data-theme=dark] .msg.err{background:#3a1d1d}html[data-theme=dark] .msg.bc{background:#10303a}
html[data-theme=dark] .msg.bc.warn{background:#3b3512}html[data-theme=dark] .msg.bc.success{background:#12331f}html[data-theme=dark] .msg.bc.promo{background:#2a1f45}
html[data-theme=dark] .tb th{background:#1c2d34;border-bottom-color:#3d6272}html[data-theme=dark] .tb td{border-bottom-color:#26404a}
html[data-theme=dark] .crow{border-bottom-color:#26404a}
html[data-theme=dark] .nav{border-top-color:#3d6272}
html[data-theme=dark] #modal .mbox{border-color:#3d6272}
/* عناصر رنگی همیشه متن مشکی دارند */
.btn,.dir,.q,.ct.y,.kv b.up,.kv b.dn,.crow.hit b,.crow.slr b,.pill.l,.pill.s,.pill.pos,.pill.neg,#toast,.cst.win,.cst.loss,.seg button{color:#000}
html[data-theme=dark] .pill.pos{background:var(--c2)}html[data-theme=dark] .pill.neg{background:var(--red)}html[data-theme=dark] .pill.l{background:var(--c1)}html[data-theme=dark] .pill.s{background:var(--c4)}
html[data-theme=dark] .cst.win{background:var(--c2)}html[data-theme=dark] .cst.loss{background:var(--red)}
html[data-theme=dark] .seg button{background:var(--yp)}html[data-theme=dark] .seg button.on{background:var(--y)}
html[data-theme=dark] .cst.loss,html[data-theme=dark] .pill.neg{background:#ffb4b4}
.hero .btn.xs{padding:5px 11px;font-size:16px;line-height:1.2}
.hero{flex-wrap:wrap;row-gap:8px}
.hero .brand{order:5;flex:1 1 100%;min-width:0}
.hero #btnTheme{margin-inline-start:auto}
/* گیج */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:4px 6px;margin:8px 0}
.gau{width:100%;max-width:128px;margin:0 auto;display:block}
.gau .gbg{fill:none;stroke:var(--gtrack);stroke-width:9;stroke-linecap:round}
.gau .gfg{fill:none;stroke-width:9;stroke-linecap:round}
.gau .gv{font:800 17px Vazirmatn,Tahoma,sans-serif;text-anchor:middle;fill:var(--ink)}
.gau .gl{font:600 7.4px Vazirmatn,Tahoma,sans-serif;text-anchor:middle;fill:var(--ink)}
.card .gau{max-width:116px}
.vt{position:relative;height:9px;border-radius:99px;background:var(--gtrack);direction:ltr;overflow:hidden;min-width:70px}
.vt i{position:absolute;top:0;bottom:0}.vt i.g{background:#0ecb81}.vt i.r{background:#f6465d}
.vt::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--ink);opacity:.45}
.vb{display:grid;grid-template-columns:minmax(90px,120px) 1fr 40px;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.vb b{text-align:end}
.ex{margin:.5em 0;line-height:1.95;font-size:13px}
.stamp{font-size:10.5px;flex:0 0 auto;align-self:center;padding-inline:6px;white-space:nowrap}
.layers{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px;touch-action:pan-x;align-items:center}
.layers .btn{flex:0 0 auto}
body.imm .layers{display:none}

<script>
/* ===== موتور تحلیل ===== */
/* موتور تحلیل: ۲۰ اندیکاتور، SMC، رژیم بازار، مشتقات، خبر، همبستگی، ورود/SL/TP */
const TFMS={'15m':9e5,'1h':36e5,'4h':144e5,'1d':864e5};
const TREND=new Set(['ema2050','ema50200','linreg','macd','adx','supertrend','ichimoku','psar','roc','aroon','donchian','keltner','trix','elder','mom','pivot']);
const REVERS=new Set(['rsi','stoch','stochrsi','bb','cci','wpr','mfi','ult','zscore']);
const DEFAULT_PARAMS={slAtr:1.8,tp1R:.8,tpR:[.8,1.6,2.4],lr:.06,pendingHours:6};
const IND=[['ema2050','EMA 20/50'],['ema50200','EMA 50/200'],['linreg','رگرسیون خطی'],['rsi','RSI'],['macd','MACD'],
['stoch','استوکاستیک'],['stochrsi','Stoch RSI'],['bb','بولینگر'],['adx','ADX / DI'],['cci','CCI'],
['wpr','ویلیامز %R'],['mfi','MFI'],['obv','OBV'],['vwap','VWAP'],['supertrend','سوپرترند'],
['ichimoku','ایچیموکو'],['psar','پارابولیک SAR'],['roc','ROC'],['aroon','آرون'],['cmf','CMF'],
['donchian','دانچیان'],['keltner','کلتنر'],['trix','TRIX'],['ult','آلتیمیت اسیلاتور'],['elder','الدر'],['zscore','Z-Score'],['mom','مومنتوم'],['pivot','پیوت کلاسیک']];
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const fmt=p=>{if(!isFinite(p))return '—';const d=Math.abs(p)>=1000?2:Math.min(10,Math.max(2,4-Math.floor(Math.log10(Math.abs(p)||1))));return p.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});};
const roll=(a,n,f)=>a.map((_,i)=>{if(i<n-1)return null;const w=a.slice(i-n+1,i+1);if(w.some(x=>x==null))return null;return f(w);});
const sma=(a,n)=>roll(a,n,w=>w.reduce((s,x)=>s+x,0)/n);
const rMax=(a,n)=>roll(a,n,w=>Math.max(...w));
const rMin=(a,n)=>roll(a,n,w=>Math.min(...w));
const ema=(a,n)=>{const r=Array(a.length).fill(null),k=2/(n+1),f=a.findIndex(x=>x!=null);if(f<0)return r;let p=null;
  for(let i=f;i<a.length;i++){if(i<f+n-1)continue;if(p===null){let s=0;for(let j=i-n+1;j<=i;j++)s+=a[j];p=s/n;}else p=a[i]*k+p*(1-k);r[i]=p;}return r;};
const rma=(a,n)=>{const r=Array(a.length).fill(null),f=a.findIndex(x=>x!=null);if(f<0)return r;let p=null;
  for(let i=f;i<a.length;i++){if(i<f+n-1)continue;if(p===null){let s=0;for(let j=i-n+1;j<=i;j++)s+=a[j];p=s/n;}else p=(p*(n-1)+a[i])/n;r[i]=p;}return r;};
function rsiCalc(c,n=14){const g=[null],l=[null];for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];g.push(Math.max(d,0));l.push(Math.max(-d,0));}
  const ag=rma(g,n),al=rma(l,n);return c.map((_,i)=>ag[i]==null?null:(al[i]===0?100:100-100/(1+ag[i]/al[i])));}

function srLevels(K,atr){
  const n=K.length,price=K[n-1].c,w=5,pts=[];
  for(let i=w;i<n-w;i++){let isH=true,isL=true;
    for(let j=i-w;j<=i+w;j++){if(j===i)continue;if(K[j].h>=K[i].h)isH=false;if(K[j].l<=K[i].l)isL=false;}
    if(isH)pts.push({p:K[i].h,i});if(isL)pts.push({p:K[i].l,i});}
  pts.sort((a,b)=>a.p-b.p);
  const tol=Math.max(atr*0.5,price*0.0015),cl=[];
  for(const q of pts){const t=cl[cl.length-1];
    if(t&&q.p-t.max<=tol){t.sum+=q.p;t.cnt++;t.max=q.p;t.rec=Math.max(t.rec,q.i);}
    else cl.push({sum:q.p,cnt:1,max:q.p,rec:q.i});}
  let lv=cl.map(x=>({p:x.sum/x.cnt,touches:x.cnt,rec:x.rec/n})).filter(x=>x.touches>=2||x.rec>0.7);
  const tail=K.slice(-100);
  lv.push({p:Math.max(...tail.map(k=>k.h)),touches:1,rec:1},{p:Math.min(...tail.map(k=>k.l)),touches:1,rec:1});
  const gap=tol*0.4;
  const sup=lv.filter(x=>x.p<price-gap).sort((a,b)=>b.p-a.p).slice(0,3);
  const res=lv.filter(x=>x.p>price+gap).sort((a,b)=>a.p-b.p).slice(0,3);
  return {sup,res};
}

function analyze(K){
  const n=K.length;if(n<120)return null;
  const h=K.map(k=>k.h),l=K.map(k=>k.l),c=K.map(k=>k.c),v=K.map(k=>k.v);
  const L=n-1,P=n-2,price=c[L];
  const tr=K.map((k,i)=>i===0?k.h-k.l:Math.max(k.h-k.l,Math.abs(k.h-c[i-1]),Math.abs(k.l-c[i-1])));
  const atr=rma(tr,14)[L]||price*0.01,atrPct=atr/price*100;
  const tp=K.map(k=>(k.h+k.l+k.c)/3);
  const votes=[];let adxV=0;
  const add=(id,val,detail)=>votes.push({id,name:IND.find(x=>x[0]===id)[1],vote:clamp(isFinite(val)?val:0,-1,1),detail});

  const e20=ema(c,20),e50=ema(c,50),e200=ema(c,200);
  add('ema2050',price>e20[L]&&e20[L]>e50[L]?1:price<e20[L]&&e20[L]<e50[L]?-1:(e20[L]>e50[L]?.3:-.3),'EMA20 '+fmt(e20[L]));
  add('ema50200',e200[L]==null?0:(e50[L]>e200[L]?.8:-.8),e200[L]==null?'داده کافی نیست':(e50[L]>e200[L]?'EMA50 بالای EMA200':'EMA50 زیر EMA200'));

  {const m=30;let sx=0,sy=0,sxy=0,sxx=0;for(let i=0;i<m;i++){const y=c[n-m+i];sx+=i;sy+=y;sxy+=i*y;sxx+=i*i;}
   const slope=(m*sxy-sx*sy)/(m*sxx-sx*sx);
   add('linreg',Math.tanh(slope*m/(2*atr)),'شیب '+(slope*m/price*100).toFixed(2)+'٪');}

  const rs=rsiCalc(c,14),r=rs[L];
  add('rsi',r<=30?1:r<=40?.4:r>=70?-1:r>=60?-.4:0,r.toFixed(1));

  {const e12=ema(c,12),e26=ema(c,26),ml=c.map((_,i)=>e12[i]!=null&&e26[i]!=null?e12[i]-e26[i]:null),sg=ema(ml,9);
   const hs=ml.map((x,i)=>x!=null&&sg[i]!=null?x-sg[i]:null),a=hs[L],b=hs[P];
   add('macd',a>0?(a>b?1:.4):(a<b?-1:-.4),'هیستوگرام '+(a/price*100).toFixed(3)+'٪');}

  const hh14=rMax(h,14),ll14=rMin(l,14);
  {const raw=c.map((x,i)=>hh14[i]==null?null:(hh14[i]===ll14[i]?50:(x-ll14[i])/(hh14[i]-ll14[i])*100));
   const K1=sma(raw,3),D1=sma(K1,3),k=K1[L],d=D1[L];
   add('stoch',k<20?(k>d?1:.4):k>80?(k<d?-1:-.4):(k>d?.2:-.2),'K '+k.toFixed(1)+' / D '+d.toFixed(1));}

  {const rm=rMax(rs,14),rn=rMin(rs,14),raw=rs.map((x,i)=>rm[i]==null?null:(rm[i]===rn[i]?.5:(x-rn[i])/(rm[i]-rn[i])));
   const k1=sma(raw,3),d1=sma(k1,3),k=k1[L]*100,d=d1[L]*100;
   add('stochrsi',k<20?(k>d?1:.4):k>80?(k<d?-1:-.4):(k>d?.2:-.2),'K '+k.toFixed(1));}

  {const mid=sma(c,20),sdv=roll(c,20,w=>{const m=w.reduce((s,x)=>s+x,0)/20;return Math.sqrt(w.reduce((s,x)=>s+(x-m)**2,0)/20);});
   const up=mid[L]+2*sdv[L],lo=mid[L]-2*sdv[L],pb=(price-lo)/((up-lo)||1);
   add('bb',pb<.05?1:pb<.2?.5:pb>.95?-1:pb>.8?-.5:(pb-.5)*.4,'%B '+(pb*100).toFixed(0));}

  {const pdm=[null],mdm=[null];for(let i=1;i<n;i++){const u=h[i]-h[i-1],d=l[i-1]-l[i];pdm.push(u>d&&u>0?u:0);mdm.push(d>u&&d>0?d:0);}
   const a14=rma(tr.map((x,i)=>i===0?null:x),14),pdi=rma(pdm,14).map((x,i)=>x==null||!a14[i]?null:100*x/a14[i]),mdi=rma(mdm,14).map((x,i)=>x==null||!a14[i]?null:100*x/a14[i]);
   const dx=pdi.map((x,i)=>x==null||mdi[i]==null?null:100*Math.abs(x-mdi[i])/((x+mdi[i])||1)),adx=rma(dx,14)[L];adxV=adx||0;
   add('adx',(pdi[L]>mdi[L]?1:-1)*Math.min((adx||0)/40,1),'ADX '+(adx||0).toFixed(1)+(pdi[L]>mdi[L]?' (+DI برتر)':' (−DI برتر)'));}

  {const ma=sma(tp,20),md=roll(tp,20,w=>{const m=w.reduce((s,x)=>s+x,0)/20;return w.reduce((s,x)=>s+Math.abs(x-m),0)/20;});
   const cci=tp.map((x,i)=>ma[i]==null?null:(x-ma[i])/(0.015*(md[i]||1e-9))),a=cci[L],b=cci[P];
   add('cci',a<-100?(a>b?1:.5):a>100?(a<b?-1:-.5):clamp(a/200,-.5,.5),a.toFixed(0));}

  {const wr=hh14[L]===ll14[L]?-50:(hh14[L]-price)/(hh14[L]-ll14[L])*-100;
   add('wpr',wr<-80?.8:wr>-20?-.8:(wr+50)/100,wr.toFixed(0));}

  {let pos=0,neg=0;for(let i=L-13;i<=L;i++){const f=tp[i]*v[i];if(tp[i]>tp[i-1])pos+=f;else if(tp[i]<tp[i-1])neg+=f;}
   const m=neg===0?100:100-100/(1+pos/neg);
   add('mfi',m<20?1:m<35?.4:m>80?-1:m>65?-.4:0,m.toFixed(0));}

  {const obv=[0];for(let i=1;i<n;i++)obv.push(obv[i-1]+(c[i]>c[i-1]?v[i]:c[i]<c[i-1]?-v[i]:0));
   const om=sma(obv,20);
   add('obv',Math.sign(obv[L]-om[L])*.7+Math.sign(obv[L]-obv[L-5])*.3,obv[L]>om[L]?'بالای میانگین':'زیر میانگین');}

  {let pv=0,vv=0;for(let i=L-23;i<=L;i++){pv+=tp[i]*v[i];vv+=v[i];}const vw=vv?pv/vv:price;
   add('vwap',clamp((price-vw)/(atr*1.5),-1,1),'VWAP '+fmt(vw));}

  {const a10=rma(tr,10);let dir=1,fu=null,fl=null;
   for(let i=0;i<n;i++){if(a10[i]==null)continue;const hl=(h[i]+l[i])/2,bu=hl+3*a10[i],bl=hl-3*a10[i];
     if(fu===null){fu=bu;fl=bl;dir=c[i]>hl?1:-1;}
     else{const pu=fu,pl=fl;fu=(bu<pu||c[i-1]>pu)?bu:pu;fl=(bl>pl||c[i-1]<pl)?bl:pl;
       if(dir===1&&c[i]<pl)dir=-1;else if(dir===-1&&c[i]>pu)dir=1;}}
   add('supertrend',dir,dir===1?'روند صعودی':'روند نزولی');}

function smcScan(K,atr){

function buildPlan(an,dir,live,P){
  P=P||DEFAULT_PARAMS;const sg=dir==='LONG'?1:-1,atr=an.atr,{sup,res}=an.sr;
  const own=dir==='LONG'?sup[0]:res[0],opp=dir==='LONG'?res[0]:sup[0];
  let entry=live,type='market',best=null;
  for(const c of [an.e20last,own&&own.p]){if(c==null)continue;const d=(live-c)*sg;if(d>.3*atr&&d<=1*atr&&(best==null||d<(live-best)*sg))best=c;}
  if(best!=null){entry=best;type='limit';}

  if(own){const d=Math.abs(entry-own.p);if(d>=.8*atr&&d<=2.4*atr&&(own.p-entry)*sg<0)sl=own.p-sg*.25*atr;}
  {const stc=an.smc&&an.smc.struct,sw=stc?(dir==='LONG'?stc.swingL:stc.swingH):null;
   if(sw!=null){const cand=sw-sg*.3*atr,d=(entry-cand)*sg;if(d>=1.0*atr&&d<=3.2*atr)sl=cand;}}

  if(opp){const d=(opp.p-entry)*sg;if(d>0&&d<R*P.tpR[0]&&d>=.6*R)tp[0]=opp.p-sg*.1*atr;}

}

function scoreSignal(an,st,ctx,entryPrice){
  st=st||{};ctx=ctx||{};const w=st.w||{},fx=st.fxw||{},P=st.params||DEFAULT_PARAMS;
  const raw=rawOf(an,w,an.regime),dir=raw>=0?'LONG':'SHORT',sg=dir==='LONG'?1:-1;
  const agree=an.votes.filter(x=>x.vote*sg>.25).length,against=an.votes.filter(x=>x.vote*sg<-.25).length;
  const live=entryPrice||an.price,atr=an.atr,{sup,res}=an.sr;
  let sc=clamp(Math.abs(raw)/.45,0,1)*56+clamp((agree-against)/(an.votes.length*.7),0,1)*18;
  const al=(r,t)=>Math.abs(r||0)<t?0:(Math.sign(r)===sg?1:-1),fm=fx.mtf??1;
  sc+=(al(ctx.h4,.12)*10+(ctx.d1||0)*sg*5+al(ctx.m15,.08)*4)*fm;
  sc+=(ctx.news||0)*sg*7*(fx.news??1);
  sc+=(ctx.deriv||0)*sg*7*(fx.deriv??1);
  sc+=an.smc.score*sg*8*(fx.smc??1);
  if(ctx.fng!=null){if(ctx.fng<=20)sc+=sg>0?2:-3;else if(ctx.fng>=80)sc+=sg>0?-3:2;}
  if(ctx.btc!=null){const c=Math.abs(ctx.corr??.6),o=al(ctx.btc,.2);sc+=o===-1?-12*c*(fx.btc??1):o===1?4*c:0;}
  if(ctx.h4s){const al4=sg>0?'bull':'bear';sc+=ctx.h4s===al4?6:(ctx.h4s==='range'?0:-10);}
  {const ext=(live-an.e20last)*sg/atr;if(ext>2.2)sc-=10;}
  if(ctx.eventSoon)sc-=10;
  const plan=buildPlan(an,dir,live,P),opp=dir==='LONG'?res[0]:sup[0],own=dir==='LONG'?sup[0]:res[0];
  if(opp){const d=Math.abs(opp.p-plan.entry)/atr;sc+=d<1?-12:d<2?-5:0;}
  if(own&&Math.abs(plan.entry-own.p)/atr<=1.2)sc+=6;

  sc=clamp(Math.round(sc),0,100);
  const fxv={mtf:clamp((ctx.h4||0)+(ctx.d1||0)*.5+(ctx.m15||0)*.5,-1,1),news:ctx.news||0,deriv:ctx.deriv||0,smc:an.smc.score,btc:ctx.btc||0};
  return {dir,score:sc,raw,agree,against,plan,fx:fxv,regime:an.regime};
}

  const S=(st&&st.stats)||{};let a=score;
  const b=S.band&&S.band[bandOf(score)];if(b&&b.n>=20){const p=(b.w+5)/(b.n+10);a=score*.6+p*100*.4;}
  const ks=S.sym&&S.sym[feat.sym];if(ks&&ks.n>=5){const p=(ks.w+2)/(ks.n+4);a+=p<.3?-8:p>.65?4:0;}

/* پیشروی وضعیت سیگنال با یک بازهٔ قیمت (های/لو). محافظه‌کارانه: اول استاپ، بعد اهداف */
function advance(s,hi,lo,now){
  if(s.closed)return false;
  const Lg=s.dir==='LONG';let changed=false,justFilled=false;
  if(s.pending){
    const fill=Lg?lo<=s.entry:hi>=s.entry,away=Lg?hi>=s.tp[0]:lo<=s.tp[0];
    if(fill){s.pending=false;s.filled=true;s.filledAt=now;changed=true;justFilled=true;}
    else if(away||(s.expAt&&now>s.expAt)){s.closed=true;s.result='NF';return true;}
    else return false;
  }
  const R=s.R||Math.abs(s.entry-s.sl),adv=Lg?s.entry-lo:hi-s.entry,fav=Lg?hi-s.entry:s.entry-lo;
  s.mae=Math.max(s.mae||0,adv/R);if(!justFilled)s.mfe=Math.max(s.mfe||0,fav/R);
  let first=true;
  for(let g=0;g<4&&!s.closed;g++){
    const stop=Lg?lo<=s.curSl:hi>=s.curSl;
    if(first&&stop){s.closed=true;s.result=s.stage===0?'SL':'TP'+s.stage;changed=true;break;}

    if(s.stage<3){const t=s.tp[s.stage],hit=Lg?hi>=t:lo<=t;

    break;

/* هر مقدار ورودی بین -۱ و ۱ است (مثبت = لانگ). موافق و برنده: وزن بالا؛ موافق و بازنده: پایین؛ مخالف برعکس */
function learnMap(w,vals,sg,win,lr,ids,normalize){
  for(const id of ids){const x=vals&&vals[id];if(x==null)continue;const a=Math.abs(x);if(a<=.2)continue;

}

/* تنظیم آهستهٔ SL/TP بر اساس بیشترین حرکت موافق/مخالف (MFE/MAE) سیگنال‌های بسته‌شده */
function tune(st){
  const rs=st.signals.filter(s=>s.closed&&s.filled&&s.mae!=null&&s.result!=='EXP').slice(-40);
  if(rs.length<15)return [];
  const P=st.params,notes=[],losses=rs.filter(s=>s.result==='SL'),wins=rs.filter(s=>s.stage>=1);
  if(losses.length>=5){const late=losses.filter(s=>(s.mfe||0)>=.8).length/losses.length;
    if(late>.4&&P.slAtr<2.6){P.slAtr=+(P.slAtr+.1).toFixed(2);notes.push('SL وسیع‌تر شد: بسیاری از استاپ‌ها قبل از ریزش به نزدیکی هدف رسیده بودند');}}
  if(wins.length>=8){const q=wins.map(s=>s.mae||0).sort((a,b)=>a-b)[Math.floor(wins.length*.8)];
    if(q<.4&&P.slAtr>1.2){P.slAtr=+(P.slAtr-.05).toFixed(2);notes.push('SL کمی تنگ‌تر شد: برندها تقریباً هیچ‌وقت نزدیک استاپ نرفتند');}}
  const hit1=wins.length/rs.length;
  if(hit1<.45&&median(rs.map(s=>s.mfe||0))<.9&&P.tp1R>.7){P.tp1R=+(P.tp1R-.1).toFixed(2);notes.push('TP1 نزدیک‌تر شد');}
  else if(hit1>.7&&P.tp1R<1.3){P.tp1R=+(P.tp1R+.1).toFixed(2);notes.push('TP1 دورتر شد');}
  P.tpR=[P.tp1R,P.tp1R*2,P.tp1R*3].map(x=>+x.toFixed(2));
  P.lr=hit1<.4?.09:.06;
  if(notes.length){st.tuneLog.push({t:Date.now(),notes});st.tuneLog=st.tuneLog.slice(-30);}
  return notes;
}

  await pool([...new Set(open.map(s=>s.sym))],6,async sym=>{try{await getK(sym,'15m');}catch(e){}});
  for(const s of open){let K;try{K=await getK(s.sym,'15m');}catch(e){continue;}sim(s,K,upTo);}
}
function learnAsOf(all,T){
  const st=newLState();
  const known=all.filter(s=>s.learnT!=null&&s.learnT<=T&&s.votes).sort((a,b)=>a.learnT-b.learnT||(a.id<b.id?-1:1));
  for(const s of known)onOutcome(st,s,s.win);
  st.signals=all.filter(s=>s.closed&&s.filled&&s.closeT!=null&&s.closeT<=T&&s.result!=='EXP').sort((a,b)=>a.closeT-b.closeT||(a.id<b.id?-1:1));
  tune(st);st.signals=[];
  return st;
}

async function buildBoardAt(j,W,prev){
  const T=j*CYC,ev=EVENTS.some(e=>{const t=Date.parse(e);return !isNaN(t)&&T>=t-120*6e4&&T<=t+30*6e4;});
  const blocked=new Set(prev.filter(s=>s.t<T&&!(s.closeT!=null&&s.closeT<=T)).map(s=>s.sym));
  let btcRaw=0,btcCloses=[];
  try{const b1=analyze(sliceAt(await getK('BTC','1h'),'1h',T,300));
    if(b1){btcCloses=b1.closes;btcRaw=rawOf(b1,W.w);
      try{const b4=analyze(sliceAt(await getK('BTC','4h'),'4h',T,300));if(b4)btcRaw=clamp(btcRaw*.5+rawOf(b4,W.w)*.5,-1,1);}catch(e){}}}catch(e){}
  const syms=UNIVERSE.filter(s=>!blocked.has(s));
  await pool(syms,6,async s=>{try{await getK(s,'1h');}catch(e){}});
  const pre=[];
  for(const sym of syms){
    let K;try{K=sliceAt(await getK(sym,'1h'),'1h',T,300);}catch(e){continue;}
    if(K.length<250)continue;const an=analyze(K);
    if(!an||!(an.quoteVol24>=2e6&&an.atrPct>=.2&&an.atrPct<=6))continue;
    const x={sym,an,live:K.at(-1).c,closes:an.closes};
    x.sc=scoreSignal(an,W,{sym,btc:btcRaw,corr:corr(x.closes,btcCloses)},x.live);
    x.adj=adjusted(x.sc.score,{sym,regime:an.regime,dir:x.sc.dir},W);
    pre.push(x);if(pre.length%8===0)await sleep0();
  }
  if(!pre.length)return [];
  pre.sort((a,b)=>b.adj-a.adj||(a.sym<b.sym?-1:1));
  const top=pre.slice(0,40);
  const news=await newsAt(T),fng=await fngAt(T);
  await pool(top,6,async x=>{try{await getK(x.sym,'4h');}catch(e){}try{await getK(x.sym,'1d');}catch(e){}await fundAt(x.sym,T);});
  for(const x of top){
    const ctx={sym:x.sym,fng,eventSoon:ev,btc:x.sym==='BTC'?null:btcRaw,corr:x.sym==='BTC'?1:corr(x.closes,btcCloses)};
    try{const k4=sliceAt(await getK(x.sym,'4h'),'4h',T,300);if(k4.length>=120){const a4=analyze(k4);if(a4){ctx.h4=rawOf(a4,W.w);ctx.h4s=a4.smc.struct.trend;}}}catch(e){}
    try{ctx.d1=htfTrend(sliceAt(await getK(x.sym,'1d'),'1d',T,200));}catch(e){}
    ctx.news=newsScore(news,x.sym,T).score;
    ctx.deriv=derivScore({fund:await fundAt(x.sym,T),oiChg:null,ls:null,priceChg:null});
    x.ctx=ctx;x.sc=scoreSignal(x.an,W,ctx,x.live);x.adj=adjusted(x.sc.score,{sym:x.sym,regime:x.an.regime,dir:x.sc.dir},W);
    const sg=x.sc.dir==='LONG'?1:-1;
    x.tfAgree=[x.sc.raw,ctx.h4,(ctx.d1||0)*.3].filter(r=>r!=null&&Math.abs(r)>=.1&&Math.sign(r)===sg).length;
    {const dd=sg>0?'bull':'bear',st=x.an.smc.struct,opp=(r,t)=>r!=null&&Math.abs(r)>=t&&Math.sign(r)===-sg;
     const rr=x.sc.plan.R/x.sc.plan.entry,okR=rr>=.003&&rr<=.09;
     const structOK=st.trend!==(sg>0?'bear':'bull')||st.choch===dd,chasing=(x.live-x.an.e20last)*sg/x.an.atr>2.2;
     const btcAgainst=ctx.btc!=null&&Math.abs(ctx.btc)>=.25&&Math.sign(ctx.btc)===-sg;
     x.tier=(okR&&x.sc.score>=66&&x.tfAgree>=2&&!opp(ctx.h4,.08)&&(ctx.d1||0)*sg>=0&&structOK&&!chasing&&!btcAgainst)?'A':
            (okR&&x.sc.score>=56&&x.tfAgree>=2&&!opp(ctx.h4,.2)&&!chasing&&!btcAgainst)?'B':'C';}
    await sleep0();
  }
  const cand=top.filter(x=>x.ctx).sort((a,b)=>(a.tier<b.tier?-1:a.tier>b.tier?1:0)||b.adj-a.adj||(a.sym<b.sym?-1:1)),picked=[],dc={LONG:0,SHORT:0};
  const okR=x=>{const r=x.sc.plan.R/x.sc.plan.entry;return r>=.003&&r<=.09;};
  const pass=(tiers,max)=>{for(const x of cand){if(picked.length>=max)break;if(picked.includes(x)||!tiers.includes(x.tier))continue;
    if(!okR(x)||dc[x.sc.dir]>=7)continue;
    if(picked.filter(p=>p.sc.dir===x.sc.dir&&corr(p.closes,x.closes)>.85).length>=2)continue;
    picked.push(x);dc[x.sc.dir]++;}};
  pass(['A'],PER);pass(['B'],PER);
  const P=W.params;
  return picked.map(x=>{const p=x.sc.plan,pend=p.type==='limit',votes={};x.an.votes.forEach(v=>votes[v.id]=v.vote);
    return {id:j+'-'+x.sym,cyc:j,sym:x.sym,dir:x.sc.dir,entry:p.entry,type:p.type,pending:pend,filled:!pend,expAt:pend?T+P.pendingHours*36e5:null,
      tp:p.tp,sl:p.sl,curSl:p.sl,R:p.R,score:x.sc.score,adj:Math.round(x.adj),regime:x.sc.regime,tfAgree:x.tfAgree,
      newsL:x.ctx.news>.15?'مثبت':x.ctx.news<-.15?'منفی':'خنثی',riskPct:riskPct(x.sc.score),why:whyOf(x),tier:x.tier,votes,fx:x.sc.fx,
      t:T,chk:T,stage:0,closed:false,result:null,mfe:0,mae:0};});
}

function summarize(all){

  return {n:rs.length,rate:rs.length?w/rs.length:null,best:fac.slice(0,3),worst:fac.slice(-2).reverse(),slAtr:st.params.slAtr,tp1R:st.params.tp1R};
}

/* نتیجهٔ هر سیگنال بر حسب R با خروج پله‌ای ۴۰٪ در TP1، ۳۰٪ در TP2 و ۳۰٪ در TP3 */
function realR(s){
  if(!s.filled)return null;
  const rr=s.tp.map(t=>Math.abs(t-s.entry)/s.R);
  if(s.stage===0)return s.result==='SL'?-1:(s.closed?0:null);
  let r=0;for(let i=0;i<s.stage;i++)r+=PORT[i]*rr[i];
  if(s.closed&&s.result!=='TP3'){const rem=1-PORT.slice(0,s.stage).reduce((a,b)=>a+b,0);r+=rem*(s.stage===1?0:rr[0]);}
  return r;
}
function roe(s){const r=realR(s);if(r==null)return null;return Math.max(-100,r*(s.R/s.entry)*100*levOf(s));}
const dayKey=t=>new Date(t).toLocaleDateString('fa-IR',{month:'long',day:'numeric'});
function dailyRows(){
  const days=new Map();
  for(const s of Object.values(HIST).sort((a,b)=>b.t-a.t)){
    const k=dayKey(s.t);let d=days.get(k);if(!d){d={k,n:0,tp1:0,tp2:0,tp3:0,sl:0,open:0,nf:0,sum:0,cnt:0,rsum:0};days.set(k,d);}
    d.n++;if(s.filled&&s.stage>=1)d.tp1++;if(s.stage>=2)d.tp2++;if(s.stage>=3)d.tp3++;if(s.result==='SL')d.sl++;if(s.result==='NF')d.nf++;if(!s.closed)d.open++;
    const x=roe(s);if(x!=null){d.sum+=x;d.cnt++;d.rsum+=realR(s);}
  }
  return [...days.values()];
}
const sgn=(x,d=1)=>(x>=0?'+':'')+x.toFixed(d);

function whyOf(x){
  const sg=x.sc.dir==='LONG'?1:-1,out=[];
  const top=[...x.an.votes].map(v=>({n:v.name,s:v.vote*sg})).filter(v=>v.s>.3).sort((a,b)=>b.s-a.s).slice(0,3).map(v=>v.n);out.push(...top);
  const sm=x.an.smc,st=sm.struct,d=sg>0?'bull':'bear';
  if(st.choch===d)out.push('CHOCH');else if(st.bos===d)out.push('BOS');
  if(sm.sweep&&sm.sweep.dir===d)out.push('شکار نقدینگی');
  if(sm.ob[d])out.push('اردر بلاک');
  return out.slice(0,6);
}

/* ---------------- فیوچرز دمو (شبیه USDT-M باینس) ----------------
   ● سفارش مارکت و لیمیت، اهرم ۱ تا ۱۲۵ (BTC ‏۱۲۵، ETH ‏۱۰۰، بقیه ۵۰)، مارجین ایزوله و کراس
   ● حالت یک‌طرفه (One-way): سفارش مخالف پوزیشن را کم می‌کند، می‌بندد یا برعکس می‌کند
   ● قیمت لیکوئید، کارمزد تیکر ۰٫۰۵٪ و میکر ۰٫۰۲٪، TP/SL روی پوزیشن
   ● قیمت‌ها زنده‌اند؛ اگر صفحه بسته بود، با کندل‌های ۱۵ دقیقه جبران می‌شود */
const FK='radar.fut1',F_FEE_T=.0005,F_FEE_M=.0002,F_START=10000,MAXL={BTC:125,ETH:100};
const maxLev=sym=>MAXL[sym]||50;
let F={start:F_START,wallet:F_START,pos:[],orders:[],hist:[],cfg:{},seq:0,fees:0,realized:0};
try{const r=JSON.parse(localStorage.getItem(FK));if(r)F={...F,...r};}catch(e){}
const fSave=()=>{try{localStorage.setItem(FK,JSON.stringify(F));}catch(e){}};
const cfgOf=sym=>F.cfg[sym]||(F.cfg[sym]={lev:Math.min(20,maxLev(sym)),mode:'isolated'});
const dsg=d=>d==='LONG'?1:-1;
const mmrOf=n=>n<=5e4?.004:n<=2.5e5?.005:n<=1e6?.01:.025;           /* نرخ مارجین نگهداری (پله‌ای ساده) */
const upnl=(p,px)=>p.qty*(px-p.entry)*dsg(p.dir);
const isoLocked=()=>F.pos.filter(o=>o.mode==='isolated').reduce((a,o)=>a+o.margin,0);
const demoBlocked=sym=>F.pos.some(p=>p.sym===sym)||F.orders.some(o=>o.sym===sym);

function liqPrice(p){
  const m=mmrOf(p.qty*p.entry);
  if(p.mode==='isolated')
    return p.dir==='LONG'?(p.qty*p.entry-p.margin)/(p.qty*(1-m)):(p.qty*p.entry+p.margin)/(p.qty*(1+m));
  let others=0,mmo=0;
  for(const o of F.pos){if(o===p||o.mode!=='cross')continue;const q=LP[o.sym]||o.entry;others+=upnl(o,q);mmo+=mmrOf(o.qty*q)*o.qty*q;}
  const wb=F.wallet-isoLocked();
  return p.dir==='LONG'?(p.qty*p.entry+mmo-wb-others)/(p.qty*(1-m)):(wb+others+p.qty*p.entry-mmo)/(p.qty*(1+m));
}
function fAvail(){
  let used=0,cu=0,res=0;
  for(const p of F.pos){if(p.mode==='isolated')used+=p.margin;else{used+=p.qty*p.entry/p.lev;const px=LP[p.sym];if(px)cu+=upnl(p,px);}}
  for(const o of F.orders)res+=o.reserve;
  return Math.max(0,F.wallet+cu-used-res);
}
function fUnreal(){let u=0;for(const p of F.pos){const px=LP[p.sym];if(px)u+=upnl(p,px);}return u;}
const fEquity=()=>F.wallet+fUnreal();

function fReduce(p,cq,price,rate,reason){
  cq=Math.min(cq,p.qty);if(!(cq>0))return;
  const pnl=cq*(price-p.entry)*dsg(p.dir),fee=cq*price*rate,frac=cq/p.qty;
  F.wallet+=pnl-fee;F.fees+=fee;F.realized+=pnl-fee;
  const mrel=p.mode==='isolated'?p.margin*frac:0;
  F.hist.unshift({id:'h'+(++F.seq),sym:p.sym,dir:p.dir,qty:cq,entry:p.entry,exit:price,pnl:pnl-fee,fee,why:reason,lev:p.lev,mode:p.mode,t:Date.now()});
  F.hist=F.hist.slice(0,200);
  p.qty-=cq;p.margin-=mrel;
  if(p.qty<=1e-12)F.pos=F.pos.filter(x=>x!==p);
}
function fLiquidate(p,price){
  const loss=p.margin;F.wallet-=loss;F.realized-=loss;
  F.hist.unshift({id:'h'+(++F.seq),sym:p.sym,dir:p.dir,qty:p.qty,entry:p.entry,exit:price,pnl:-loss,fee:0,why:'لیکوئید شد',lev:p.lev,mode:p.mode,t:Date.now()});
  F.hist=F.hist.slice(0,200);F.pos=F.pos.filter(x=>x!==p);
}
function fCrossCheck(){
  const cp=F.pos.filter(p=>p.mode==='cross');if(!cp.length)return false;
  let eq=F.wallet-isoLocked(),mm=0;
  for(const p of cp){const px=LP[p.sym];if(!px)return false;eq+=upnl(p,px);mm+=mmrOf(p.qty*px)*p.qty*px;}
  if(eq>mm)return false;
  const before=F.wallet;
  for(const p of cp){const px=LP[p.sym];F.hist.unshift({id:'h'+(++F.seq),sym:p.sym,dir:p.dir,qty:p.qty,entry:p.entry,exit:px,pnl:upnl(p,px),fee:0,why:'لیکوئید شد (کراس)',lev:p.lev,mode:'cross',t:Date.now()});}
  F.pos=F.pos.filter(p=>p.mode!=='cross');
  F.wallet=isoLocked();F.realized+=F.wallet-before;F.hist=F.hist.slice(0,200);
  return true;
}
function fApplyFill(sym,dir,qty,price,lev,mode,rate,tp,sl,at){
  let ex=F.pos.find(p=>p.sym===sym);
  if(ex&&ex.dir!==dir){
    const cq=Math.min(qty,ex.qty);fReduce(ex,cq,price,rate,'بسته/کاهش با سفارش مخالف');qty-=cq;
    if(qty<=1e-12)return;ex=null;
  }
  const fee=qty*price*rate;F.wallet-=fee;F.fees+=fee;F.realized-=fee;
  if(ex){const nq=ex.qty+qty;ex.entry=(ex.entry*ex.qty+price*qty)/nq;ex.qty=nq;if(mode==='isolated')ex.margin+=qty*price/lev;if(tp)ex.tp=tp;if(sl)ex.sl=sl;}
  else F.pos.push({id:'p'+(++F.seq),sym,dir,qty,entry:price,lev,mode,margin:mode==='isolated'?qty*price/lev:0,tp:tp||null,sl:sl||null,t:at,chkT:at});
}
function fFillOrder(o,price,at){
  F.orders=F.orders.filter(x=>x!==o);
  fApplyFill(o.sym,o.dir,o.qty,price,o.lev,o.mode,F_FEE_M,o.tp,o.sl,at);
}
/* هر بازهٔ قیمتی (های/لو): اول لیکوئید/SL (هر کدام به قیمت ورود نزدیک‌تر بود)، بعد TP — محافظه‌کارانه */
function fAdvancePos(p,hi,lo){
  const L=p.dir==='LONG',liq=p.mode==='isolated'?liqPrice(p):null;
  let lv=p.sl,isLiq=false;
  if(L){if(liq!=null&&liq>(lv==null?-Infinity:lv)){lv=liq;isLiq=true;}
    if(lv!=null&&lo<=lv){isLiq?fLiquidate(p,lv):fReduce(p,p.qty,lv,F_FEE_T,'استاپ (SL)');return true;}
    if(p.tp!=null&&hi>=p.tp){fReduce(p,p.qty,p.tp,F_FEE_T,'حد سود (TP)');return true;}}
  else{if(liq!=null&&liq<(lv==null?Infinity:lv)){lv=liq;isLiq=true;}
    if(lv!=null&&hi>=lv){isLiq?fLiquidate(p,lv):fReduce(p,p.qty,lv,F_FEE_T,'استاپ (SL)');return true;}
    if(p.tp!=null&&lo<=p.tp){fReduce(p,p.qty,p.tp,F_FEE_T,'حد سود (TP)');return true;}}
  return false;
}
function futTick(now){
  let ch=false;
  for(const o of [...F.orders]){const px=LP[o.sym];if(!px)continue;
    if(o.dir==='LONG'?px<=o.price:px>=o.price){fFillOrder(o,o.price,now);ch=true;}else o.chkT=now;}
  if(fCrossCheck())ch=true;
  for(const p of [...F.pos]){const px=LP[p.sym];if(!px)continue;if(fAdvancePos(p,px,px))ch=true;else p.chkT=now;}
  if(ch||F.pos.length||F.orders.length)fSave();
  return ch;
}
async function futCatchup(){
  const now=Math.floor(Date.now()/MS15)*MS15,items=[...F.pos,...F.orders];if(!items.length)return;
  const syms=[...new Set(items.map(x=>x.sym))];
  for(const s of syms)delete DATA[s+'15m'];
  await pool(syms,4,async s=>{try{await getK(s,'15m');}catch(e){}});
  for(const s of syms){let K;try{K=await getK(s,'15m');}catch(e){continue;}
    for(const k of K){
      if(k.t+MS15>now)break;
      for(const o of F.orders.filter(x=>x.sym===s)){if(k.t<o.chkT)continue;
        if(o.dir==='LONG'?k.l<=o.price:k.h>=o.price)fFillOrder(o,o.price,k.t+MS15);else o.chkT=k.t+MS15;}
      for(const p of F.pos.filter(x=>x.sym===s)){if(k.t<p.chkT)continue;
        if(fAdvancePos(p,k.h,k.l))continue;p.chkT=k.t+MS15;}
    }}
  fSave();
}
/* ثبت سفارش. خروجی: متن خطا یا رشتهٔ خالی در صورت موفقیت */
function fPlace(o){
  const sym=o.sym,px=LP[sym];if(!px)return 'قیمت زندهٔ این نماد در دسترس نیست.';
  const c=cfgOf(sym),lev=c.lev,mode=c.mode,dir=o.dir,usd=+o.usd;
  if(!(usd>=5))return 'حداقل اندازهٔ سفارش ۵ دلار است.';
  const limitPx=+o.price;
  if(o.type==='limit'&&!(limitPx>0))return 'قیمت سفارش لیمیت را وارد کن.';
  const marketable=o.type==='market'||(dir==='LONG'?limitPx>=px:limitPx<=px);
  const price=marketable?px:limitPx,qty=+(usd/price).toPrecision(8);
  const tp=o.tp?+o.tp:null,sl=o.sl?+o.sl:null;
  if(tp&&(dir==='LONG'?tp<=price:tp>=price))return 'TP باید در جهت سود باشد (لانگ بالاتر از ورود، شورت پایین‌تر).';
  if(sl&&(dir==='LONG'?sl>=price:sl<=price))return 'SL باید در جهت ضرر باشد (لانگ پایین‌تر از ورود، شورت بالاتر).';
  const ex=F.pos.find(p=>p.sym===sym);
  const closeQty=ex&&ex.dir!==dir?Math.min(qty,ex.qty):0,openQty=qty-closeQty;
  const need=openQty*price/lev,fee=qty*price*(marketable?F_FEE_T:F_FEE_M);
  const freed=closeQty>0?(ex.mode==='isolated'?ex.margin*closeQty/ex.qty:ex.entry*closeQty/ex.lev):0;
  if(need+fee>fAvail()+freed+1e-9)return 'موجودی قابل‌استفاده کافی نیست.';
  if(marketable)fApplyFill(sym,dir,qty,price,lev,mode,F_FEE_T,tp,sl,Date.now());
  else F.orders.push({id:'o'+(++F.seq),sym,dir,qty,price:limitPx,lev,mode,tp,sl,reserve:need+qty*limitPx*F_FEE_T,t:Date.now(),chkT:Date.now()});
  fSave();return '';
}
function fClosePos(id,frac){
  const p=F.pos.find(x=>x.id===id);if(!p)return 'پوزیشن پیدا نشد.';
  const px=LP[p.sym];if(!px)return 'قیمت زنده در دسترس نیست.';
  fReduce(p,frac>=1?p.qty:p.qty*frac,px,F_FEE_T,frac>=1?'بسته شد (دستی)':'کاهش دستی ('+Math.round(frac*100)+'٪)');
  fSave();return '';
}
function fSetTpSl(id,tp,sl){
  const p=F.pos.find(x=>x.id===id);if(!p)return 'پوزیشن پیدا نشد.';
  const px=LP[p.sym],L=p.dir==='LONG';
  if(px){if(tp&&(L?tp<=px:tp>=px))return 'TP باید در جهت سود نسبت به قیمت فعلی باشد.';
         if(sl&&(L?sl>=px:sl<=px))return 'SL باید در جهت ضرر نسبت به قیمت فعلی باشد.';}
  p.tp=tp||null;p.sl=sl||null;fSave();return '';
}

function posCard(p){
  const px=LP[p.sym],L=p.dir==='LONG',un=px?upnl(p,px):0;
  const margin=p.mode==='isolated'?p.margin:p.qty*p.entry/p.lev,roe=margin?un/margin*100:0,liq=liqPrice(p);
  return `<div class="item"><div class="between"><div><b class="num">${p.sym}USDT</b> <span class="pill ${L?'l':'s'}">${L?'لانگ':'شورت'} ${fa(p.lev)}×</span> <span class="pill">${p.mode==='isolated'?'ایزوله':'کراس'}</span></div>
    <span class="pill ${un>=0?'pos':'neg'} num">${sgn(un,2)} USDT</span></div>
    <div class="g3"><div><span>ROE</span><b class="num">${sgn(roe,2)}٪</b></div><div><span>اندازه (${p.sym})</span><b class="num">${qfmt(p.qty)}</b></div><div><span>مارجین</span><b class="num">${usd2(margin)}</b></div>
    <div><span>قیمت ورود</span><b class="num">${fmt(p.entry)}</b></div><div><span>قیمت مارک</span><b class="num">${px?fmt(px):'—'}</b></div><div><span>قیمت لیکوئید</span><b class="num">${isFinite(liq)&&liq>0?fmt(liq):'—'}</b></div></div>
    <div class="note num" style="margin:6px 0 0">TP: ${p.tp?fmt(p.tp):'—'} | SL: ${p.sl?fmt(p.sl):'—'}</div>
    <div class="cbtn"><button class="btn xs" data-ftpsl="${p.id}">TP/SL</button><button class="btn xs" data-fclose="${p.id}:0.5">بستن ۵۰٪</button><button class="btn xs" data-fclose="${p.id}:1">بستن مارکت</button></div></div>`;

let chBound=false;
function bindChartOnce(){
  if(chBound)return;const cv=$('#chCv');if(!cv)return;chBound=true;
  const ptr=new Map();let drag=null,pinch=null;
  cv.addEventListener('pointerdown',e=>{
    try{cv.setPointerCapture(e.pointerId);}catch(er){}
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size===1)drag={x:e.clientX,off:CT.off};
    else if(ptr.size===2){const [a,b]=[...ptr.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),n:CT.n};drag=null;}
  });
  cv.addEventListener('pointermove',e=>{
    const M=CT;if(!M.K)return;
    const r=cv.getBoundingClientRect(),step=(r.width-64)/Math.min(M.n,M.K.length);
    if(ptr.has(e.pointerId))ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size===2&&pinch){      /* زوم دو انگشتی */
      const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
      M.n=clamp(Math.round(pinch.n*pinch.d/Math.max(d,1)),10,Math.min(400,M.K.length));
      M.off=clamp(M.off,0,Math.max(0,M.K.length-M.n));drawChart();return;
    }
    if(drag)M.off=clamp(drag.off+Math.round((e.clientX-drag.x)/step),0,Math.max(0,M.K.length-M.n));
    M.hov=Math.floor((e.clientX-r.left)/step);drawChart();
  });
  const up=e=>{
    ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;
    if(ptr.size===0)drag=null;else if(ptr.size===1){const [a]=[...ptr.values()];drag={x:a.x,off:CT.off};}
  };
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){CT.hov=null;drawChart();}});
  cv.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1:-1);},{passive:false});
  if(window.ResizeObserver)new ResizeObserver(()=>{if(TAB==='chart')drawChart();}).observe($('#chBox'));
}

function gauge(v,label){
  v=Math.max(0,Math.min(100,v));const a=Math.PI*(1-v/100),x=50+40*Math.cos(a),y=50-40*Math.sin(a);
  const col=v>=70?'#0ecb81':v>=45?'#ebeb00':'#f6465d';
  return `<svg viewBox="0 0 100 62" class="gau" role="img" aria-label="${label} ${Math.round(v)}"><path d="M10 50A40 40 0 0 1 90 50" class="gbg"/>${v>0.5?`<path d="M10 50A40 40 0 0 1 ${x.toFixed(1)} ${y.toFixed(1)}" stroke="${col}" class="gfg"/>`:''}<text x="50" y="45" class="gv">${fa(Math.round(v))}</text><text x="50" y="59" class="gl">${label}</text></svg>`;
}
const mini=n=>{const p=Math.round(Math.min(1,Math.abs(n))*100);return `<div class="vt"><i class="${n>=0?'g':'r'}" style="${n>=0?'left:50%':'right:50%'};width:${p/2}%"></i></div>`;};
function cycGauges(board){
  const el=$('#cycG');if(!el)return;if(!board.length){el.innerHTML='';return;}
  const avg=board.reduce((a,s)=>a+s.score,0)/board.length,lg=board.filter(s=>s.dir==='LONG').length/board.length*100,aq=board.filter(s=>s.tier==='A').length/board.length*100;
  el.innerHTML=gauge(avg,'میانگین قدرت')+gauge(lg,'سهم لانگ')+gauge(aq,'سیگنال A');
}

 ll(a,i,n){let m=Infinity;for(let j=Math.max(0,i-n+1);j<=i;j++)if(a[j]<m)m=a[j];return m;},

    ['فاندینگ مخالف نیست',lm.fund==null?null:(dir>0?lm.fund<.05:lm.fund>-.05)],
    ['ترس و طمع افراطی و مخالف نیست',lm.fng==null?null:!(dir>0&&lm.fng>80)&&!(dir<0&&lm.fng<20)],
    ['قدرت نسبی در برابر BTC هم‌جهت است',main.meta.rs==null?null:Math.sign(main.meta.rs)===dir],
    ['تا مانع مقابل حداقل ۱٫۲ ATR فاصله هست',oppD==null?null:oppD>=1.2]
  ]:[];
  const cnt=chk.filter(x=>x[1]!=null),ok=cnt.filter(x=>x[1]).length,ratio=cnt.length?ok/cnt.length:0,grade=!dir?'—':ratio>=.8?'A':ratio>=.65?'B':ratio>=.5?'C':'D';
  const R=1.8*atr,tps=DEFAULT_PARAMS.tpR.map(m=>dir>0?px+R*m:px-R*m),sl=dir>0?px-R:px+R;
  const vd=s=>s>.5?'صعودی قوی':s>.15?'صعودی':s>-.15?'خنثی':s>-.5?'نزولی':'نزولی قوی',dirw=vd(comp);
  const out={t:Date.now(),sym,tfs,comp,dir,dirw,px,atr,up,dn,chk,ok,total:cnt.length,grade,sl,tps,lm,main};
  FCACHE[sym]=out;return out;
}
function fullHTML(F){
  const tfRows=['15m','1h','4h','1d'].filter(t=>F.tfs[t]).map(t=>{const s=F.tfs[t].sum;return `<tr><td>${t}</td><td><span class="ixp ${ixCls(s.sc)}">${s.vd}</span></td><td>${mini(s.sc)}</td><td class="num">${fa(s.b)} / ${fa(s.n)} / ${fa(s.r)}</td></tr>`;}).join('');

  const m4=F.tfs['4h'],m1=F.main.meta,lm=F.lm;

    lm.fund!=null?`فاندینگ: ${lm.fund.toFixed(4)}٪`:'',lm.oi!=null?`Open Interest: ${Math.round(lm.oi/1e6).toLocaleString('fa-IR')} میلیون دلار`:'',
    lm.fng!=null?`ترس و طمع: ${lm.fng} (${fngLabel(lm.fng)})`:''].filter(Boolean);
  const long=F.dir>0;
  const plan=F.dir?`<p class="ex">جهت پیشنهادی: <b>${long?'لانگ':'شورت'}</b> — ورود نزدیک ${fmt(F.px)}، حد ضرر ${fmt(F.sl)} (۱٫۸ برابر ATR)، حد سودها ${F.tps.map(fmt).join(' / ')}.</p>${(F.dir>0?F.up[0]:F.dn[0])?`<p class="ex">اولین مانع مقابل ${fmt((F.dir>0?F.up[0]:F.dn[0]).p)} است؛ اگر قبل از TP1 قرار دارد، بخشی از سود را همان‌جا بگیر.</p>`:''}`:'<p class="ex">اندیکاتورها و تایم‌فریم‌ها جهت روشنی نمی‌دهند؛ ورود توصیه نمی‌شود. صبر کن تا یکی از سطوح بالا یا پایین شکسته شود.</p>';
  const scen=[
    F.up[0]?`<b>سناریوی صعودی:</b> بسته‌شدن کندل بالای ${fmt(F.up[0].p)} با حجم بالا، هدف بعدی ${F.up[1]?fmt(F.up[1].p):fmt(F.px+F.atr*3)}؛ ابطال با شکست ${F.dn[0]?fmt(F.dn[0].p):fmt(F.px-F.atr*1.8)}.`:'',
    F.dn[0]?`<b>سناریوی نزولی:</b> بسته‌شدن کندل زیر ${fmt(F.dn[0].p)} با حجم بالا، هدف بعدی ${F.dn[1]?fmt(F.dn[1].p):fmt(F.px-F.atr*3)}؛ ابطال با عبور از ${F.up[0]?fmt(F.up[0].p):fmt(F.px+F.atr*1.8)}.`:''].filter(Boolean);
  return `<div class="box" style="text-align:center"><b>${F.sym}/USDT</b> · ${fmt(F.px)}<div class="gauges" style="grid-template-columns:repeat(2,minmax(110px,150px));justify-content:center">${gauge(Math.round((F.comp+1)*50),'امتیاز جامع')}${gauge(F.dir?Math.round(F.ok/Math.max(1,F.total)*100):0,'کیفیت تأیید')}</div><span class="ixp ${ixCls(F.comp)} big">${F.dirw}</span> ${F.dir?`<span class="pill">رتبه ${F.grade}</span>`:''}</div>
  <h3 class="sub">تایم‌فریم‌ها</h3><div class="scroll"><table class="tb"><thead><tr><th>بازه</th><th>جهت</th><th>قدرت</th><th>صعودی/خنثی/نزولی</th></tr></thead><tbody>${tfRows}</tbody></table></div>
  <h3 class="sub">وضعیت بازار</h3><div class="box">${regime.map(x=>`<p class="ex">${x}</p>`).join('')}</div>
  <h3 class="sub">سطوح کلیدی (۱ ساعته و ۴ ساعته)</h3><div class="scroll"><table class="tb"><thead><tr><th></th><th>سطح</th><th>فاصله</th><th>بازه</th><th>قدرت</th></tr></thead><tbody>${F.up.slice().reverse().map(x=>lvRow(x,'مقاومت')).join('')}${F.dn.map(x=>lvRow(x,'حمایت')).join('')}</tbody></table></div>
  <h3 class="sub">مشتقات و احساسات</h3><div class="box">${der.length?der.map(x=>`<p class="ex">${x}</p>`).join(''):'<p class="note">داده فیوچرز در این شبکه در دسترس نیست (معمولاً به VPN نیاز دارد).</p>'}</div>
  <h3 class="sub">نقشهٔ معامله</h3><div class="box">${plan}${scen.map(x=>`<p class="ex">${x}</p>`).join('')}</div>
  ${F.dir?`<h3 class="sub">چک‌لیست تأیید (${fa(F.ok)} از ${fa(F.total)})</h3><div class="box">${F.chk.map(x=>`<p class="ex">${x[1]==null?'➖':x[1]?'✅':'❌'} ${x[0]}</p>`).join('')}</div>`:''}
  <div class="acts"><button class="btn" id="iCopy">کپی گزارش</button><button class="btn" id="iRef">به‌روزرسانی</button></div>
  <p class="note">این گزارش آماری است و سود تضمین نمی‌کند؛ همیشه حد ضرر داشته باش. داده‌ها بر اساس کندل‌های بسته‌شده محاسبه می‌شوند.</p>`;
}
function fullText(F){
  const t=[`گزارش جامع ${F.sym}/USDT — قیمت ${fmt(F.px)}`,`جمع‌بندی: ${F.dirw}${F.dir?` | رتبه ${F.grade}`:''}`];
  ['15m','1h','4h','1d'].filter(x=>F.tfs[x]).forEach(x=>{const s=F.tfs[x].sum;t.push(`${x}: ${s.vd} (${s.b} صعودی / ${s.n} خنثی / ${s.r} نزولی)`);});
  if(F.dir){t.push(`${F.dir>0?'لانگ':'شورت'} | ورود ${fmt(F.px)} | SL ${fmt(F.sl)} | TP ${F.tps.map(fmt).join(' / ')}`);}
  if(F.up[0])t.push('مقاومت: '+F.up.map(x=>fmt(x.p)).join(' / '));if(F.dn[0])t.push('حمایت: '+F.dn.map(x=>fmt(x.p)).join(' / '));
  return t.join('\n');
}

let IXS=Object.assign({sym:'BTC',tf:'1h',view:'ind',grp:'همه',st:'all',data:null,full:null,loading:false,err:''},store.get('radar.ind',{}));IXS.loading=false;IXS.data=null;IXS.full=null;IXS.err='';

function indListHTML(d){
  const s=d.sum,pct=x=>(x/s.total*100).toFixed(1);
  let list=d.list.filter(x=>(IXS.grp==='همه'||x.g===IXS.grp)&&(IXS.st==='all'||(IXS.st==='b'&&x.s>0)||(IXS.st==='n'&&x.s===0)||(IXS.st==='r'&&x.s<0)));
  const head=`<div class="box" style="text-align:center"><b>${IXS.sym}/USDT</b> · ${IXS.tf} · ${fmt(d.px)}<div class="gauges" style="grid-template-columns:minmax(120px,170px);justify-content:center">${gauge(s.pct,'جمع‌بندی')}</div><span class="ixp ${ixCls(s.sc)} big">${s.vd}</span>
   <div class="ixbar" aria-hidden="true"><i class="b" style="width:${pct(s.b)}%"></i><i class="n" style="width:${pct(s.n)}%"></i><i class="r" style="width:${pct(s.r)}%"></i></div>
   <div class="ixcnt"><span><b class="num">${fa(s.b)}</b> صعودی</span><span><b class="num">${fa(s.n)}</b> خنثی</span><span><b class="num">${fa(s.r)}</b> نزولی</span><span>از <b class="num">${fa(s.total)}</b> اندیکاتور</span></div>
   <div class="ixg">${IXG.map(g=>`<span class="ixp ${ixCls(s.g[g].sc)}">${g}: ${s.g[g].vd}</span>`).join('')}</div></div>`;

  const f2=`<div class="seg">${[['all','همه'],['b','صعودی'],['n','خنثی'],['r','نزولی']].map(([k,t])=>`<button data-ist="${k}" class="${IXS.st===k?'on':''}">${t}</button>`).join('')}</div>`;
  const rows=list.map(x=>`<div class="ixr"><div class="ixn"><b>${x.n}</b><span class="num">${x.v}</span></div><span class="ixp ${ixCls(x.s)}">${ixLab(x.s)}</span><div class="ixk"><i class="${ixCls(x.s)}" style="width:${Math.round(x.k*100)}%"></i></div></div>`).join('')||'<p class="note">موردی نیست.</p>';

function renderIndOut(){
  const o=$('#indOut');if(!o)return;indSyncUI();
  if(IXS.loading){o.innerHTML='<p class="note">در حال دریافت و محاسبهٔ اندیکاتورها…</p>';return;}

  if(IXS.view==='ind')o.innerHTML=IXS.data?indListHTML(IXS.data):'';else o.innerHTML=IXS.full?fullHTML(IXS.full):'';
}
async function indLoad(force){
  indShell();const si=$('#iSym');if(si){const v=si.value.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/USDT$/,'');if(v)IXS.sym=v;}
  store.set('radar.ind',{sym:IXS.sym,tf:IXS.tf,view:IXS.view});IXS.loading=true;IXS.err='';renderIndOut();
  try{if(IXS.view==='ind')IXS.data=await ixGet(IXS.sym,IXS.tf,force);else IXS.full=await ixFull(IXS.sym,force);}
  catch(e){console.error(e);IXS.err='دریافت داده انجام نشد. اینترنت یا VPN را بررسی کن و نماد را چک کن.';}
  IXS.loading=false;renderIndOut();
}
function renderInd(){indShell();indSyncUI();const have=IXS.view==='ind'?IXS.data:IXS.full;if(!have&&!IXS.loading)indLoad(false);else renderIndOut();}
document.addEventListener('click',e=>{

  const tf=q('[data-itf]');if(tf){IXS.tf=tf.dataset.itf;IXS.data=null;indLoad(false);return;}
  const g=q('[data-igrp]');if(g){IXS.grp=g.dataset.igrp;renderIndOut();return;}
  const st=q('[data-ist]');if(st){IXS.st=st.dataset.ist;renderIndOut();return;}
  if(t.id==='iRun'){IXS.data=null;IXS.full=null;indLoad(true);return;}

  try{

function cacheSave(){
  try{localStorage.setItem(KEY,JSON.stringify({k:K_NOW,limited,summ:SUMM,signals:ALL.filter(s=>s.cyc>=K_NOW-2).map(slim)}));}catch(e){}
}
async function main(){
  if(busy)return;errMsg='';K_NOW=Math.floor(Date.now()/CYC);
  let c=null;try{c=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  const OFFMSG='اتصال برقرار نشد؛ آخرین تحلیل ذخیره‌شده نمایش داده می‌شود و با وصل شدن اینترنت خودکار به‌روز می‌شود.';
  const useCache=()=>{if(c&&c.signals&&c.signals.length){ALL=c.signals;SUMM=c.summ;limited=!!c.limited;try{mergeHist();}catch(e){}return true;}return false;};
  busy=true;
  PROG=(t,f)=>{$('#prog').textContent=t;$('#cycleBar').style.width=Math.round(f*100)+'%';};
  try{
    if(c&&c.k===K_NOW){ALL=c.signals;SUMM=c.summ;limited=!!c.limited;mergeHist();renderActive();
      for(const sym of new Set(ALL.filter(s=>!s.closed).map(s=>s.sym)))delete DATA[sym+'15m'];
      await simulateSigs(ALL);await simulateHistOpen();mergeHist();cacheSave();}
    else{renderActive();ALL=await computeAll(K_NOW);limited=lastSrc===3;SUMM=summarize(ALL);mergeHist();await simulateHistOpen();mergeHist();cacheSave();}
    if(!ALL.some(s=>s.cyc===K_NOW)){errMsg=useCache()?OFFMSG:'تحلیل بازار انجام نشد. اینترنت یا VPN را بررسی کن.';}
  }catch(e){errMsg=useCache()?OFFMSG:'دریافت داده از صرافی‌ها انجام نشد. اینترنت یا VPN را بررسی کن.';}
  busy=false;$('#prog').textContent='';renderActive();pollLive().then(()=>futCatchup()).then(()=>renderActive());
}
